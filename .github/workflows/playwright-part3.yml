name: Playwright Part 3 - View/Edit Task and Sign In
# Part 3 of 3 of the full suite (192 tests). Run the three parts together: playwright-part1/2/3.yml
# Parts are split by spec file so no spec is ever in two parts. Manual trigger only, so a push does not start 3 runs.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests whose title matches this text (optional)'
        required: false
        default: ''
      workers:
        description: 'Playwright workers for this part (1 = safest: specs share one sandbox user)'
        required: false
        default: '1'
permissions:
  contents: read

# Same group as playwright.yml: all runs sign in as the same sandbox user and change the same data, so runs
# queue one after another instead of overlapping. Do NOT give the parts different groups unless each part
# uses its own sandbox user.
concurrency:
  group: atlas-sandbox
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Get Playwright version
      id: pw
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - name: Install Playwright Chromium (cache miss)
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Install Playwright system deps only (cache hit)
      if: steps.pw-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Run Playwright tests (part 3 of 3)
      run: npx playwright test tests/viewEditTask.spec.js tests/signIn.spec.js ${GREP:+--grep "$GREP"} --workers=${WORKERS:-1} --pass-with-no-tests
      env:
        BW_LABEL: part3
        GREP: ${{ inputs.grep }}
        WORKERS: ${{ inputs.workers }}
        BASE_URL: ${{ secrets.BASE_URL }}
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
        LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        TEST_TOTP_SECRET: ${{ secrets.TEST_TOTP_SECRET }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: test-reports-part3
        path: reports/
        retention-days: 30
