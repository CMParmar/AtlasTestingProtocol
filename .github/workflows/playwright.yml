name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Spec files or folders to run (space-separated, e.g. tests/person.spec.js tests/company.spec.js). Leave empty for all.'
        required: false
        default: ''
      grep:
        description: 'Only run tests whose title matches this text (optional)'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 360
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test $TESTS ${GREP:+--grep "$GREP"} --workers=1
      env:
        TESTS: ${{ inputs.tests }}
        GREP: ${{ inputs.grep }}
        BASE_URL: ${{ secrets.BASE_URL }}
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
        LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        TEST_TOTP_SECRET: ${{ secrets.TEST_TOTP_SECRET }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: test-reports
        path: reports/
        retention-days: 30
