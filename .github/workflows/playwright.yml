name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Spec files or folders to run (space-separated, e.g. tests/person.spec.js tests/company.spec.js). Leave empty for all.'
        required: false
        default: ''
      grep:
        description: 'Only run tests whose title matches this text (optional)'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The app stores scope / tab / filters per user, so specs that share the signed-in user must never run
        # at the same time (not in parallel workers, not on parallel machines). Each job below owns one project
        # and runs it with a single worker; the two jobs use different projects/state and run side by side.
        include:
          - name: tasks
            project: chromium-auth
          - name: signin
            project: chromium
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Get Playwright version
      id: pw
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - name: Install Playwright Chromium (cache miss)
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Install Playwright system deps only (cache hit)
      if: steps.pw-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Show runner hardware
      run: |
        lscpu | grep -E 'Model name|^CPU\(s\)'
        free -h
        df -h /
        cat /etc/os-release | grep PRETTY_NAME
    - name: Run Playwright tests
      run: npx playwright test $TESTS ${GREP:+--grep "$GREP"} --project=${{ matrix.project }} --workers=1 --pass-with-no-tests
      env:
        TESTS: ${{ inputs.tests }}
        GREP: ${{ inputs.grep }}
        BASE_URL: ${{ secrets.BASE_URL }}
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
        LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        TEST_TOTP_SECRET: ${{ secrets.TEST_TOTP_SECRET }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: test-reports-${{ matrix.name }}
        path: reports/
        retention-days: 30

  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Download all shard reports
      uses: actions/download-artifact@v7
      with:
        pattern: test-reports-*
        path: shards
    - name: Build combined reports
      run: |
        mkdir -p merged-allure site/html site/excel
        for d in shards/*/; do
          n=$(basename "$d" | sed 's/test-reports-//')
          [ -d "$d/allure-results" ] && cp -r "$d"/allure-results/. merged-allure/
          [ -d "$d/html" ] && cp -r "$d/html" "site/html/$n"
          [ -d "$d/excel" ] && cp -r "$d/excel" "site/excel/$n"
        done
        npx allure generate merged-allure -o site/allure --clean
        {
          echo '<!doctype html><meta charset="utf-8"><title>Atlas Test Reports</title>'
          echo '<h1>Atlas Test Reports</h1><ul>'
          echo '<li><a href="allure/index.html">Allure report (all shards combined)</a></li>'
          for h in site/html/*/; do
            n=$(basename "$h")
            echo "<li><a href=\"html/$n/index.html\">Playwright HTML report - $n</a></li>"
          done
          echo '</ul><p>Excel workbooks are in the <code>test-reports-*</code> artifacts of the run (also under <code>excel/</code> here).</p>'
        } > site/index.html
    - name: Upload combined reports (artifact)
      id: combined
      uses: actions/upload-artifact@v7
      with:
        name: combined-reports
        path: site/
        retention-days: 30
    - name: Upload Pages artifact
      if: github.event_name != 'pull_request'
      continue-on-error: true
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/
    - name: Deploy to GitHub Pages
      id: deploy
      if: github.event_name != 'pull_request'
      continue-on-error: true   # Pages not enabled yet -> do not fail the run; the zip artifact still has everything
      uses: actions/deploy-pages@v4
    - name: Report links
      run: |
        {
          echo '## Test reports'
          if [ -n "${{ steps.deploy.outputs.page_url }}" ]; then
            echo "- [Report index](${{ steps.deploy.outputs.page_url }})"
            echo "- [Allure report](${{ steps.deploy.outputs.page_url }}allure/index.html)"
          fi
          echo "- [Download combined reports (zip)](${{ steps.combined.outputs.artifact-url }})"
        } >> "$GITHUB_STEP_SUMMARY"
