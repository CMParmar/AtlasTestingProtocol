name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests whose title matches this text (optional)'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read

# All runs sign in as the same sandbox user and change the same data, so two runs (e.g. a push and a pull_request,
# or two manual runs) must never overlap. Extra runs wait in the queue instead of being cancelled.
concurrency:
  group: atlas-sandbox
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The whole suite (all 35 spec files, ~980 tests) is split by spec file into 6 jobs of ~165 tests, each run
        # with 5 workers (job1 and job4: 1 worker, see below). Specs that depend on each other are kept in the SAME job, creators listed first:
        #   job1: the Person search specs all change the same saved Person search preferences of the shared user,
        #         so parallel workers overwrite each other's criteria/columns: 1 worker.
        #   job2: account + account-update create the records account-search looks for; company-search is
        #         read-only and shares the Company/Account search data.
        #   job3: tasks (createTask/viewEditTask/manageTask/signalCenter) share the per-user scope/tab/filters and
        #         starred/unread counts (a starring test in another worker changes the others' counts): 1 worker.
        #   job4: adddocument -> documentViewEdit share the parent project's documents; conversation-message ->
        #         conversation-follow/star/message-search/notify-user share the parent project's Conversation; signIn.
        #         job4 runs with 1 worker: parallel workers overload /Project/Edit/818 (goto timeouts) and the
        #         conversation specs change the same follow/star state.
        #   job5: service -> service-update share one Account; rate-card-add -> rate-card share one Rate Card.
        #   job6: project -> project-update share one Account; person/company create + update specs.
        include:
          - name: job1
            workers: 1
            tests: >-
              tests/person-search.spec.js tests/base-search.spec.js tests/advanced-search.spec.js
              tests/quick-search.spec.js tests/search-results-config.spec.js
          - name: job2
            workers: 5
            tests: >-
              tests/account.spec.js tests/account-update.spec.js tests/account-search.spec.js
              tests/company-search.spec.js
          - name: job3
            workers: 1
            tests: >-
              tests/createTask.spec.js tests/viewEditTask.spec.js tests/manageTask.spec.js tests/signalCenter.spec.js
          - name: job4
            workers: 1
            tests: >-
              tests/adddocument.spec.js tests/documentViewEdit.spec.js tests/conversation-message.spec.js
              tests/conversation-follow.spec.js tests/conversation-star.spec.js tests/message-search.spec.js
              tests/notify-user.spec.js tests/signIn.spec.js
          - name: job5
            workers: 5
            tests: >-
              tests/service.spec.js tests/service-update.spec.js tests/rate-card-add.spec.js tests/rate-card.spec.js
              tests/bundle.spec.js
          - name: job6
            workers: 5
            tests: >-
              tests/project.spec.js tests/project-update.spec.js tests/person.spec.js tests/person-update.spec.js
              tests/person-negative.spec.js tests/company.spec.js tests/company-update.spec.js
              tests/company-negative.spec.js tests/admin-reset.spec.js
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Get Playwright version
      id: pw
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - name: Install Playwright Chromium (cache miss)
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Install Playwright system deps only (cache hit)
      if: steps.pw-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium
    - name: Show runner hardware
      run: |
        lscpu | grep -E 'Model name|^CPU\(s\)'
        free -h
        df -h /
        cat /etc/os-release | grep PRETTY_NAME
    - name: Run Playwright tests
      run: npx playwright test $TESTS ${GREP:+--grep "$GREP"} --workers=${{ matrix.workers }} --pass-with-no-tests
      env:
        BW_LABEL: ${{ matrix.name }}
        TESTS: ${{ matrix.tests }}
        GREP: ${{ inputs.grep }}
        BASE_URL: ${{ secrets.BASE_URL }}
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
        LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        TEST_TOTP_SECRET: ${{ secrets.TEST_TOTP_SECRET }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: test-reports-${{ matrix.name }}
        path: reports/
        retention-days: 30

  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Download all shard reports
      uses: actions/download-artifact@v7
      with:
        pattern: test-reports-*
        path: shards
    - name: Build combined reports
      run: |
        mkdir -p merged-allure site/html site/excel site/bandwidth
        for d in shards/*/; do
          n=$(basename "$d" | sed 's/test-reports-//')
          [ -d "$d/allure-results" ] && cp -r "$d"/allure-results/. merged-allure/
          [ -d "$d/html" ] && cp -r "$d/html" "site/html/$n"
          [ -d "$d/excel" ] && cp -r "$d/excel" "site/excel/$n"
          [ -f "$d/bandwidth/bandwidth.csv" ] && cp "$d/bandwidth/bandwidth.csv" "site/bandwidth/bandwidth-$n.csv"
        done
        npx allure generate merged-allure -o site/allure --clean
        {
          echo '<!doctype html><meta charset="utf-8"><title>Atlas Test Reports</title>'
          echo '<h1>Atlas Test Reports</h1><ul>'
          echo '<li><a href="allure/index.html">Allure report (all shards combined)</a></li>'
          for h in site/html/*/; do
            n=$(basename "$h")
            echo "<li><a href=\"html/$n/index.html\">Playwright HTML report - $n</a></li>"
          done
          for b in site/bandwidth/*.csv; do
            [ -f "$b" ] && echo "<li><a href=\"bandwidth/$(basename "$b")\">Bandwidth CSV - $(basename "$b" .csv | sed 's/bandwidth-//')</a></li>"
          done
          echo '</ul><p>Excel workbooks are in the <code>test-reports-*</code> artifacts of the run (also under <code>excel/</code> here).</p>'
        } > site/index.html
    - name: Upload combined reports (artifact)
      id: combined
      uses: actions/upload-artifact@v7
      with:
        name: combined-reports
        path: site/
        retention-days: 30
    - name: Upload Pages artifact
      if: github.event_name != 'pull_request'
      continue-on-error: true
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/
    - name: Deploy to GitHub Pages
      id: deploy
      if: github.event_name != 'pull_request'
      continue-on-error: true   # Pages not enabled yet -> do not fail the run; the zip artifact still has everything
      uses: actions/deploy-pages@v4
    - name: Report links
      run: |
        {
          echo '## Test reports'
          if [ -n "${{ steps.deploy.outputs.page_url }}" ]; then
            echo "- [Report index](${{ steps.deploy.outputs.page_url }})"
            echo "- [Allure report](${{ steps.deploy.outputs.page_url }}allure/index.html)"
          fi
          echo "- [Download combined reports (zip)](${{ steps.combined.outputs.artifact-url }})"
        } >> "$GITHUB_STEP_SUMMARY"
